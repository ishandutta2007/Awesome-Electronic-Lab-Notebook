<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      .pulse-node {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card1 {
        animation: floatOne 6s ease-in-out infinite alternate;
      }
      .float-card2 {
        animation: floatTwo 7s ease-in-out infinite alternate;
      }
      .dna-helix {
        animation: rotateDna 20s linear infinite;
        transform-origin: 1050px 200px;
      }
      .glow-text {
        text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      }

      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes rotateDna {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="400" fill="url(#glowCyan)" rx="16" />
  <rect width="1200" height="400" fill="url(#glowPurple)" rx="16" />

  <!-- Animated Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Background Dynamic Graphic Elements (Molecular Nodes & Orbiting DNA) -->
  <g class="pulse-node" opacity="0.4">
    <!-- Connecting network lines -->
    <path d="M 850 100 L 980 180 L 920 310 L 1080 320 L 1120 120 Z" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,4" />
    <!-- Glowing Nodes -->
    <circle cx="850" cy="100" r="6" fill="#00f2fe" />
    <circle cx="980" cy="180" r="8" fill="#4facfe" />
    <circle cx="920" cy="310" r="5" fill="#7928ca" />
    <circle cx="1080" cy="320" r="7" fill="#00f2fe" />
    <circle cx="1120" cy="120" r="6" fill="#4facfe" />
  </g>

  <!-- Floating Glass Cards (Dynamic Visual Accents in background layer) -->
  <g class="float-card1">
    <rect x="860" y="60" width="180" height="65" rx="12" fill="url(#glassGrad)" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="880" y="90" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧬 FAIR Data Compliant</text>
    <text x="880" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Findable &amp; Reusable</text>
  </g>

  <g class="float-card2">
    <rect x="940" y="240" width="200" height="75" rx="12" fill="url(#glassGrad)" stroke="#7928ca" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="960" y="272" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open Source &amp; SaaS</text>
    <text x="960" y="295" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Lab Management Tools</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitle (High contrast, clearly visible) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="75" width="260" height="32" rx="16" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1" />
    <text x="16" y="96" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">🧪 RESEARCH DATA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="170" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" class="glow-text">
      Awesome Electronic
    </text>
    <text x="0" y="225" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" class="glow-text">
      Lab Notebooks
    </text>

    <!-- Subtitle -->
    <text x="0" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Curated List of SaaS Platforms, Open-Source ELNs &amp; LIMS Solutions
    </text>

    <!-- Stat Highlights Bar -->
    <g transform="translate(0, 310)">
      <text x="0" y="20" fill="#4facfe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">● 12+ SaaS Enterprise Suites</text>
      <text x="210" y="20" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">● 14+ Open-Source Projects</text>
      <text x="430" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">● FAIR Data &amp; 21 CFR Part 11</text>
    </g>
  </g>
</svg>
